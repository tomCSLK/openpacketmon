name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing openpacketmon! Please never attach captures with private traffic, the start link or
        session cookies to an issue; reduce captures to the packets that show the problem.
  - type: input
    id: version
    attributes:
      label: openpacketmon version
      description: Shown at the bottom of the sidebar, or run `openpacketmon --version`.
      placeholder: "0.2.1"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installed with
      options:
        - Debian package (.deb)
        - Built from source
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Distribution and desktop
      placeholder: "Ubuntu 26.04, GNOME (Wayland)"
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Capture source (if relevant)
      description: Network adapter (wired, Wi-Fi, VPN …), capture file or IPFIX collector.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: For example `journalctl --user -u openpacketmon --since "10 min ago"`, or the terminal output.
      render: text
