# cargo deny --workspace check: licenses, sources, duplicate crates and RustSec advisories of the dependencies of
# openpacketmon and openpacketmon-capture (without --workspace only those of openpacketmon are checked).
# https://embarkstudios.github.io/cargo-deny/

[graph]
# openpacketmon is built for Linux and Windows
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

[advisories]
# report unmaintained and unsound crates anywhere in the tree, as cargo audit does
unmaintained = "all"
unsound = "all"
# Vulnerabilities always fail. Unmaintained and unsound crates fail as well, except these known ones that only
# arrive through other crates; they are checked again when those crates are updated.
# Checked 2026-11-02: accesskit_unix 0.24.1 and accesskit_atspi_common 0.21.1 are the newest releases and still use
# zbus 5; the advisories say the crates were merged into zbus 6, not that they have a flaw.
ignore = [
    { id = "RUSTSEC-2026-0370", reason = "zvariant (merged into zbus 6) only through accesskit_unix, the screen reader support of egui" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names (merged into zbus 6) only through accesskit_unix, the screen reader support of egui" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive (merged into zbus 6) only through accesskit_unix, the screen reader support of egui" },
]

[licenses]
# Permissive licenses only.
# Where a crate offers a choice (e.g. self_cell: Apache-2.0 OR GPL-2.0-only), cargo deny takes an allowed one.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # Boost, permissive: under Windows for clipboard-win and error-code, the clipboard of egui
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
# The fonts built into egui as fallbacks: Hack (MIT and Bitstream Vera License), Emoji Icon Font (MIT), Noto Emoji
# (OFL-1.1), Ubuntu Light (Ubuntu-font-1.0). All allow embedding and redistribution with their license texts, which
# dev/third-party-licenses.py copies into THIRD-PARTY-LICENSES.txt.
exceptions = [
    { crate = "epaint_default_fonts", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
]
# the workspace crates are not published
private = { ignore = true }

[bans]
# Several versions of a crate only warn: they come from dependencies (e.g. the window system and the TLS stack) and are
# removed when those are updated.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
