{# pause/resume and stop buttons of the page heads; needs `capture`, `t`, `layout`, `back` #}
{% if let Some(c) = capture %}
  {% if !c.finished %}
  <form method="post" action="/capture/pause">
    <input type="hidden" name="csrf_token" value="{{ layout.csrf_token }}">
    <input type="hidden" name="back" value="{{ back }}">
    <button type="submit" class="secondary">{% if c.frozen %}{{ t.get("capture-resume") }}{% else %}{{ t.get("capture-pause") }}{% endif %}</button>
  </form>
  {% endif %}
  <form method="post" action="/capture/stop">
    <input type="hidden" name="csrf_token" value="{{ layout.csrf_token }}">
    <button type="submit" class="danger">{{ t.get("capture-stop") }}</button>
  </form>
{% endif %}
